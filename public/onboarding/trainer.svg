<svg width="192" height="320" viewBox="0 0 192 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="192" height="320" fill="#ffffff"/>

  <!-- Header -->
  <text x="16" y="32" fill="#171717" font-family="system-ui" font-size="18" font-weight="bold">AI Trainer</text>

  <!-- AI Message Bubble -->
  <rect x="12" y="48" width="150" height="72" rx="12" fill="#f5f5f5"/>
  <text x="20" y="68" fill="#171717" font-family="system-ui" font-size="10">Hey! I'm your AI personal</text>
  <text x="20" y="82" fill="#171717" font-family="system-ui" font-size="10">trainer. I can help you plan</text>
  <text x="20" y="96" fill="#171717" font-family="system-ui" font-size="10">workouts, track progress,</text>
  <text x="20" y="110" fill="#171717" font-family="system-ui" font-size="10">and reach your goals.</text>

  <!-- Quick suggestions -->
  <rect x="12" y="128" width="110" height="24" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="20" y="144" fill="#71717a" font-family="system-ui" font-size="9">Plan a push day workout</text>

  <rect x="12" y="158" width="100" height="24" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="20" y="174" fill="#71717a" font-family="system-ui" font-size="9">Analyze my progress</text>

  <!-- User Message -->
  <rect x="42" y="194" width="138" height="36" rx="12" fill="#f97316"/>
  <text x="52" y="210" fill="#ffffff" font-family="system-ui" font-size="10">How can I improve my</text>
  <text x="52" y="222" fill="#ffffff" font-family="system-ui" font-size="10">bench press?</text>

  <!-- AI Response -->
  <rect x="12" y="238" width="160" height="48" rx="12" fill="#f5f5f5"/>
  <text x="20" y="256" fill="#171717" font-family="system-ui" font-size="10">Great question! Here are</text>
  <text x="20" y="270" fill="#171717" font-family="system-ui" font-size="10">some tips for improving</text>
  <text x="20" y="284" fill="#171717" font-family="system-ui" font-size="10">your bench press...</text>

  <!-- Input Area -->
  <rect x="0" y="292" width="192" height="28" fill="#ffffff"/>
  <line x1="0" y1="292" x2="192" y2="292" stroke="#e5e5e5"/>
  <rect x="12" y="298" width="140" height="20" rx="10" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="20" y="312" fill="#a1a1aa" font-family="system-ui" font-size="10">Ask anything...</text>
  <circle cx="168" cy="308" r="10" fill="#f97316"/>
  <path d="M165 308 L171 308 M168 305 L168 311" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
</svg>